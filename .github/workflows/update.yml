name: "Regenerate schemes from upstream"
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0" # https://crontab.guru/every-week
  push:
    branches: [main]
    paths: ["mappings/**", "src/**"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  regenerate:
    name: "Regenerate and commit schemes"
    runs-on: "ubuntu-latest"
    permissions:
      contents: write # push regenerated schemes to main
    steps:
      - name: "Fetch the repository code"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false

      - name: "Install uv"
        uses: "astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884" # v10.3.0
        with:
          enable-cache: false

      - name: "Install tinted-builder-rust"
        uses: "jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8" # v3.0.0
        with:
          repo: "tinted-theming/tinted-builder-rust"

      - name: "Regenerate the schemes"
        run: |
          uv sync --locked
          for mapping in mappings/*.toml; do
            uv run colortemplate2tinty "$mapping"
          done

      - name: "Check that templates build from them"
        run: ./scripts/build-check.sh

      - name: "Commit the changes, if any"
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add base16 base24 tinted8
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Regenerate schemes from upstream [skip ci]"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
