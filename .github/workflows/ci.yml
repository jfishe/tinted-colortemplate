name: "CI"
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prek:
    name: "Run prek hooks"
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    steps:
      - name: "Fetch the repository code"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false

      - name: "Install uv"
        uses: "astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2" # v10.3.3
        with:
          enable-cache: false

      - name: "Run the hooks on every file"
        run: uvx prek@0.5.7 run --all-files --show-diff-on-failure

  test:
    name: "Test and type check"
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    steps:
      - name: "Fetch the repository code"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false

      - name: "Install uv"
        uses: "astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2" # v10.3.3

      - name: "Install dependencies"
        run: uv sync --locked

      - name: "Test"
        run: uv run pytest

      - name: "Type check"
        run: uv run pyrefly check

  build-check:
    name: "Build templates from the schemes"
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    steps:
      - name: "Fetch the repository code"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false

      - name: "Install tinted-builder-rust"
        uses: "jaxxstorm/action-install-gh-release@b82b2052fdf822192f2119b7e289a6f63e668bc8" # v4.0.0
        with:
          repo: "tinted-theming/tinted-builder-rust"

      - name: "Build tinted-shell against the schemes"
        run: ./scripts/build-check.sh
