# Mapping for https://codeberg.org/lifepillar/vim-solarized8
# Spec syntax is documented in src/colortemplate2tinty/convert.py.

[theme]
repo = "https://codeberg.org/lifepillar/vim-solarized8.git"
templates = ["solarized8", "solarized8_flat", "solarized8_high", "solarized8_low"]
family = "Solarized 8"
author = "jfishe (generated by colortemplate2tinty)"
theme-author = "Ethan Schoonover; Vim port by Lifepillar (https://codeberg.org/lifepillar/vim-solarized8)"

# tinted8's palette is solarized8's `Term Colors`, so the terminal matches what
# the scheme expects in 16-colour Vim, with one exception. Solarized makes
# ANSI 8 (bright black) the background colour, but eza punctuation (the
# symlink `->`), zsh-autosuggestions and git's dim output all draw in ANSI 8
# and vanish. Use the comment grey instead. Vim with termguicolors is
# unaffected.
["tinted8.palette"]
black-bright = "Comment.fg"

# base16/base24 put the background in ANSI 0 and the foreground in ANSI 7, so
# they cannot copy `Term Colors`. Use Solarized's tonal ramp instead. The names
# are swapped in each Background section, so the same names work for light.
[base16]
base01 = "base02"
base02 = "base01"
base03 = "base00"
base04 = "base0"
base06 = "base2"
base07 = "base3"
base0F = "violet"

[base24]
base01 = "base02"
base02 = "base01"
base03 = "base00"
base04 = "base0"
base06 = "base2"
base07 = "base3"
base0F = "violet"

# The low-contrast variant uses base02 as the background, so put the
# surrounding tone in base01.
[variants.solarized8_low.base16]
base01 = "base03"

[variants.solarized8_low.base24]
base01 = "base03"
