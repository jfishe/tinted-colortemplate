# Mapping for https://codeberg.org/lifepillar/vim-gruvbox8
# Spec syntax is documented in src/colortemplate2tinty/convert.py.

[theme]
repo = "https://codeberg.org/lifepillar/vim-gruvbox8.git"
templates = ["gruvbox8", "gruvbox8_hard", "gruvbox8_soft"]
family = "Gruvbox 8"
author = "jfishe (generated by colortemplate2tinty)"
theme-author = "morhetz; Vim port by Lifepillar (https://codeberg.org/lifepillar/vim-gruvbox8)"

# Gruvbox's ErrorMsg is bg0 on red, so ErrorMsg.hue would be the background.
["tinted8.ui"]
"status.error" = "Error.hue"

# Gruvbox's bg0-bg4 and fg0-fg4 are named by role in both backgrounds, so the
# same ramp works for dark and light. base16 accents are the colours Vim's
# syntax groups use (Term colors 9-14), as in the upstream base16-gruvbox.
[base16]
base00 = "bg0"
base01 = "bg1"
base02 = "bg2"
base03 = "grey"
base04 = "fg4"
base05 = "fg1"
base06 = "fg0"
base07 = "fg0"
base08 = "red"
base09 = "orange"
base0A = "yellow"
base0B = "green"
base0C = "aqua"
base0D = "blue"
base0E = "purple"
base0F = "neutralorange"

# base24 keeps the ANSI accents: the neutral* colours in base08-0E and the
# syntax colours in base12-17.
[base24]
base00 = "bg0"
base01 = "bg1"
base02 = "bg2"
base03 = "grey"
base04 = "fg4"
base05 = "fg1"
base06 = "fg0"
base07 = "fg0"
base09 = "orange"
base0F = "neutralorange"
