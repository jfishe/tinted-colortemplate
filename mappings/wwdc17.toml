# Mapping for https://codeberg.org/lifepillar/vim-wwdc17-theme
# Spec syntax is documented in src/colortemplate2tinty/convert.py.

[theme]
repo = "https://codeberg.org/lifepillar/vim-wwdc17-theme.git"
templates-dir = "template"
templates = ["wwdc17"]
family = "WWDC17"
author = "jfishe (generated by colortemplate2tinty)"
theme-author = "Lifepillar (https://codeberg.org/lifepillar/vim-wwdc17-theme)"

# WWDC17 (light only) has four neutrals: brightwhite (background), white,
# brightblack (comments) and black (foreground). base02 takes the comment grey
# rather than the blue Visual background; base06/base07 continue the ramp
# toward the foreground. ANSI 3 equals ANSI 9 (#d87900, the orange), so base0A
# uses brightyellow; ANSI 13 nearly duplicates magenta, so base0F uses
# brightblue, WWDC17's purple.
[base16]
base02 = "brightblack"
base06 = "black"
base07 = "black"
base0A = "brightyellow"
base0F = "brightblue"

[base24]
base02 = "brightblack"
base06 = "black"
base07 = "black"
base0A = "brightyellow"
base0F = "brightblue"
