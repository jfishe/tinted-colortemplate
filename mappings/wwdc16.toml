# Mapping for https://codeberg.org/lifepillar/vim-wwdc16-theme
# Spec syntax is documented in src/colortemplate2tinty/convert.py.

[theme]
repo = "https://codeberg.org/lifepillar/vim-wwdc16-theme.git"
templates-dir = "template"
templates = ["wwdc16"]
family = "WWDC16"
author = "jfishe (generated by colortemplate2tinty)"
theme-author = "Lifepillar (https://codeberg.org/lifepillar/vim-wwdc16-theme)"

# WWDC16's ANSI 8 (brightblack, #353547) is barely distinguishable from the
# background, so eza punctuation, zsh-autosuggestions and git's dim output
# vanish. Use the comment grey instead, as for Solarized.
["tinted8.palette"]
black-bright = "Comment.fg"

# WWDC16 has only four neutrals (black, brightblack, white, brightwhite).
# base02 takes the comment grey rather than the blue Visual background, so
# templates that draw bright black from it stay neutral and visible. base06
# would default to ANSI 7, which is darker than the foreground. The default
# base09 (ANSI 9) is a second red; brightyellow is WWDC16's orange.
[base16]
base02 = "white"
base06 = "brightwhite"
base09 = "brightyellow"

[base24]
base02 = "white"
base06 = "brightwhite"
base09 = "brightyellow"
