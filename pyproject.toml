[project]
name = "colortemplate2tinty"
version = "0.1.0"
description = "Convert vim-colortemplate colour schemes into tinty custom schemes"
authors = [
    { name = "John D. Fisher", email = "jdfenw@gmail.com" }
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
colortemplate2tinty = "colortemplate2tinty:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyrefly>=1.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff.lint]
extend-select = ["I"]
